name: api

on:
  push:
    branches: [main]
    paths: ["api/**", "docker-compose.yml", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "docker-compose.yml", ".github/workflows/api.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifecity
          POSTGRES_PASSWORD: lifecity
          POSTGRES_DB: lifecity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifecity -d lifecity_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The tests migrate this database with Alembic, so the migrations run against real Postgres.
      LIFECITY_TEST_DATABASE_URL: postgresql+psycopg://lifecity:lifecity@localhost:5432/lifecity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
